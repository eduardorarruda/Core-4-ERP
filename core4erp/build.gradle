plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com'
version = '0.0.1-SNAPSHOT'
description = 'Core 4 ERP'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

// Sobrescreve a versão gerenciada pelo Boot 3.5 (3.17.0) — CVE-2025-48924 corrigida na 3.18.0+
ext['commons-lang3.version'] = '3.20.0'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'io.github.cdimascio:dotenv-java:3.2.0'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

	// OpenAPI / Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	// Observabilidade
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// Rate limiting
	implementation 'com.bucket4j:bucket4j-core:8.10.1'

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Spring AI
	implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	// RAG — banco vetorial Qdrant (embeddings de documentos/descrições)
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'
	// CVE-2025-55163 (grpc-netty-shaded/Netty "MadeYouReset" HTTP/2 DoS): o qdrant-client traz io.grpc 1.65.1
	// transitivamente. O BOM do gRPC força todos os módulos io.grpc para uma versão corrigida (>= 1.75).
	implementation platform('io.grpc:grpc-bom:1.84.3')
	// MCP server — expõe as habilidades financeiras (as @Tool) pelo protocolo MCP (SSE/WebMVC)
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

	// Email
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// In-memory cache with TTL (chat history)
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// Excel report generation
	implementation 'org.apache.poi:poi-ooxml:5.5.1'

	// Extração de texto de PDF (anexos do chat / RAG)
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// Teste de integração opt-in do Qdrant via gRPC (QdrantGrpcIntegracaoTest) — versão vem do grpc-bom
	testImplementation 'io.grpc:grpc-api'
}

tasks.named('test') {
	useJUnitPlatform()
}