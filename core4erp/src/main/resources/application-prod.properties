# Configurações de produção — sobrepõem application.properties
# Ativar com: SPRING_PROFILES_ACTIVE=prod (obrigatório no docker-compose do servidor).

# ── Banco ──────────────────────────────────────────────────────────────────────
# Pool maior em produção (sobrescrever via DB_POOL_SIZE no environment)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2

# Flyway ESTRITO em produção: sem migrações fora de ordem e sem ignorar migrações ausentes.
# Só '*:future' (padrão do Flyway) é tolerado — permite rollback do jar sem travar a subida.
# ANTES do deploy, conferir no banco de produção:
#   SELECT version, description FROM flyway_schema_history WHERE version IN ('2','3') ORDER BY 1;
# Se houver linhas (V2/V3 foram consolidadas na V4 e não existem mais no classpath), rodar
# 'flyway repair' uma vez ou, temporariamente, SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS='*:missing,*:future'.
spring.flyway.out-of-order=false
spring.flyway.ignore-migration-patterns=*:future

# ── Erros: nunca expor detalhes internos ───────────────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ── Proxy reverso (nginx/Cloudflare) ───────────────────────────────────────────
# Usa o suporte nativo do Tomcat (RemoteIpValve) para X-Forwarded-* vindos de proxies internos.
server.forward-headers-strategy=native

# ── OpenAPI/Swagger desligados em produção (não expor o mapa da API) ──────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Actuator: só na porta interna 8081; sem detalhes de saúde; sem gravar trocas HTTP ──
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.httpexchanges.recording.enabled=false

# ── Logs: JSON estruturado (ECS) em stdout → promtail/Loki ─────────────────────
app.log.format=json
