spring.application.name=core4erp
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Perfil default (dev/local): tolerante. *:missing — V2/V3 foram consolidadas na V4 e bancos antigos
# ainda têm esse histórico; out-of-order — branches paralelas em dev. Produção é ESTRITA (ver
# application-prod.properties).
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.out-of-order=true


# Estatisticas Hibernate (desabilitado em producao; ativar via env em staging para detectar N+1)
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_STATS_ENABLED:false}

server.port=${PORT:8080}

# Respostas de erro do Spring nunca expõem mensagem/stack/exceção/erros de binding ao cliente
# (o GlobalExceptionHandler já devolve mensagens amigáveis).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Logs: 'texto' (legível, dev) ou 'json' (ECS estruturado — Loki). Perfil prod força json.
# Ver logback-spring.xml.
app.log.format=${LOG_FORMAT:texto}

# HikariCP — limite configurável via DB_POOL_SIZE. Default 8: com 3 conexões o chat (tools em
# paralelo ao streaming) + schedulers esgotavam o pool. Produção usa 10 (application-prod).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=120000

# Jackson — serializar datas como ISO-8601 string (evita arrays e problemas de parse no frontend)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Criptografia em repouso de CPF/CNPJ e dados bancários (AES-256-GCM) + índice cego (HMAC-SHA256).
# OBRIGATÓRIAS em todos os perfis (a aplicação não sobe sem elas): 32 bytes em base64 cada, chaves
# DIFERENTES. Gerar com:  openssl rand -base64 32
# NUNCA troque/perca a chave: os dados cifrados ficam ilegíveis. Ver config/crypto/CriptografiaCampos.
app.crypto.data-encryption-key=${DATA_ENCRYPTION_KEY:}
app.crypto.data-hmac-key=${DATA_HMAC_KEY:}
# Cifra na subida os valores legados em texto puro (idempotente). false = pular.
app.crypto.migrar-na-subida=${CRYPTO_MIGRAR_NA_SUBIDA:true}

# JWT
# HMAC (legado) — opcional quando JWT_PRIVATE_KEY/JWT_PUBLIC_KEY (RS256) estão configuradas; o
# JwtService cai para HMAC e avisa em prod. Sem default vazio a aplicação quebrava no boot.
jwt.secret=${SECRET_KEY:}
jwt.expiration=${TOKEN_EXPIRATION:604800000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true

# Cookie de sessão: SameSite (Lax = defesa contra CSRF; None só com front/API em sites diferentes).
security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
# Atrás de proxy confiável (Cloudflare/nginx): usa CF-Connecting-IP/X-Real-IP como IP do cliente.
security.trusted-proxy=${TRUSTED_PROXY:false}

# CORS — origens permitidas (separadas por vírgula); substituído pelo CorsConfig bean
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Spring AI — OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.1
# Teto de tokens da resposta — controle de custo. Subido de 1024 para evitar truncar
# respostas com tabelas/listas longas (ver tratamento de finishReason=length no ChatService).
spring.ai.openai.chat.options.max-tokens=3072
# Inclui o uso de tokens (Usage) também no modo streaming. Sem isto a OpenAI não envia
# usage em .stream(), e perderíamos o log [CHAT-USAGE] e as métricas/painel de custo.
spring.ai.openai.chat.options.stream-usage=true
# Resiliência: o limite de tokens/min da OpenAI (429 rate_limit_exceeded) é TRANSITÓRIO —
# o próprio corpo do erro pede "try again in ~10s". Com retry+backoff o usuário não vê o erro
# em alta concorrência (sem falsos positivos para usuários legítimos). Demais 4xx não repetem.
spring.ai.retry.max-attempts=4
spring.ai.retry.on-client-errors=false
spring.ai.retry.on-http-codes=429
spring.ai.retry.backoff.initial-interval=4s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=16s
# Propaga ThreadLocals (SecurityContext) para as threads do Reactor durante o streaming,
# garantindo que as tools enxerguem o usuário/tenant correto. Ver ChatAiConfig.
spring.reactor.context-propagation=auto

# Chat IA
chat.relatorios.dir=${java.io.tmpdir}/core4erp-relatorios
chat.relatorios.ttl-minutes=60
# Nº máximo de mensagens do histórico carregadas do banco por conversa
chat.historico.max-mensagens=20

# Chat — anexos (planilhas/OFX). max-chars limita o conteúdo enviado ao LLM (custo de tokens);
# acima disso é caso de delegar ao n8n. n8n.webhook-url vazio = processamento em processo (MVP).
chat.anexo.max-chars=15000
chat.n8n.webhook-url=${N8N_WEBHOOK_URL:}
# Eventos de domínio (cada ação da IA) enviados ao n8n. Vazio = desligado. Fora do caminho crítico.
chat.n8n.eventos-webhook-url=${N8N_EVENTOS_WEBHOOK_URL:}

# Orquestrador do chat: 'interno' (pipeline Spring AI in-process, padrão), 'n8n' (delega ao n8n
# para todos) ou 'shadow' (delega só para admin do sistema — validação em produção sem afetar os demais).
# Fallback automático para 'interno' se o n8n falhar. Rollback instantâneo trocando a env.
chat.orquestrador=${CHAT_ORQUESTRADOR:interno}
chat.n8n.aurea-webhook-url=${N8N_AUREA_WEBHOOK_URL:http://n8n:5678/webhook/aurea}
chat.n8n.webhook-secret=${N8N_WEBHOOK_SECRET:}
# Timeout de leitura da chamada ao webhook do n8n (segundos). O ramo LOTE multi-agente
# (extrator→verificador→revisor→executor→redator) demora mais; produção usa 90 (< ~100s do
# Cloudflare free). DEVE ser maior que o orçamento do pipeline no n8n para não reexecutar (duplicar).
chat.n8n.read-timeout-seconds=${N8N_READ_TIMEOUT_SECONDS:60}

# MCP Server — publica as habilidades financeiras (as @Tool) pelo protocolo MCP. Uso interno
# (endpoints /sse e /mcp/message exigem auth e não são roteados pelo nginx). type=SYNC (WebMVC).
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=core4erp-financeiro
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Preço do modelo p/ estimar custo (métrica chat.custo.usd.total + log CHAT-USAGE). Default = gpt-4o-mini
# (USD por 1M tokens). Ajuste ao trocar de modelo. Não afeta o comportamento, só a métrica de custo.
chat.preco.input-usd-por-milhao=${CHAT_PRECO_INPUT:0.15}
chat.preco.output-usd-por-milhao=${CHAT_PRECO_OUTPUT:0.60}

# Upload de arquivos (anexo do chat e conciliação OFX) — default do Boot é 1MB, pouco p/ planilhas.
# Coerente com ChatAnexoService.MAX_BYTES (5 MB por arquivo); a requisição tem 1 MB de folga p/ campos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# RAG — Qdrant (banco vetorial) + embeddings OpenAI. O backend conecta no Qdrant interno via gRPC (6334).
# Isolamento por empresa é garantido por filtro de metadado (empresaId) no retrieval — ver RagService.
# initialize-schema=false: o do Spring AI chamava a API de embeddings no boot para descobrir a dimensão
# (OpenAI fora/chave inválida = backend não subia). A coleção (+ índice keyword em empresaId) é criada
# pelo QdrantColecaoInicializador com a dimensão abaixo, tolerante a falhas (WARN e segue).
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:qdrant}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION:core4erp_rag}
spring.ai.vectorstore.qdrant.initialize-schema=false
# Sem TLS: o Qdrant fica só na rede interna do docker compose (não exposto à internet).
spring.ai.vectorstore.qdrant.use-tls=false
# API key do Qdrant (service.api_key / QDRANT__SERVICE__API_KEY no container). Vazio = sem auth (dev).
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
# ATENÇÃO: a dimensão do embedding (1536 p/ text-embedding-3-small) fica fixada na coleção criada no
# boot. Trocar OPENAI_EMBEDDING_MODEL por um modelo de outra dimensão exige ajustar
# OPENAI_EMBEDDING_DIMENSIONS e recriar a coleção no Qdrant.
rag.dimensao-embedding=${OPENAI_EMBEDDING_DIMENSIONS:1536}
# Retrieval (ajustáveis): top-k = nº de trechos; similaridade-minima = corte de relevância (0..1).
rag.top-k=${RAG_TOP_K:4}
rag.similaridade-minima=${RAG_SIMILARIDADE_MINIMA:0.4}
rag.qdrant-rest-url=${RAG_QDRANT_REST_URL:http://${QDRANT_HOST:qdrant}:6333}

# E-mail (reset de senha)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_FROM:noreply@core4erp.com}
# Liga/desliga o envio. false (default): nada é enviado; fora do perfil prod o link de redefinição/
# convite é registrado no log (INFO) para demonstração — em prod, nunca.
app.mail.enabled=${MAIL_ENABLED:false}
app.frontend.url=${CORS_ORIGINS:http://localhost:5173}

# Actuator / Prometheus — SOMENTE na porta de gerenciamento (8081), acessível apenas na rede interna
# do compose (Prometheus/healthcheck). A API pública (8080) não serve /actuator.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
# O MailHealthIndicator conecta no SMTP a cada /actuator/health: sem credenciais (ou Gmail instável)
# o health ficava DOWN → container unhealthy → frontend nunca subia. Só avalia com o envio ligado.
management.health.mail.enabled=${MAIL_ENABLED:false}
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=core4erp
management.metrics.tags.environment=${APP_ENV:development}
management.httpexchanges.recording.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
