apiVersion: 1
# Datasources provisionados como código: editable:false impede alterar URL/credenciais pela UI
# (mudanças passam por este arquivo + `docker compose restart grafana`).

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
