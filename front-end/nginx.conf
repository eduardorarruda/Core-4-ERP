server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Chat streaming (SSE) — deve vir ANTES de /api/ (match mais específico).
    # Sem buffering para os deltas chegarem token a token; timeout longo porque o ramo
    # LOTE multi-agente da Áurea (extrator→verificador→revisor→executor→redator) demora.
    # O backend emite comentários de keepalive a cada ~15s para o Cloudflare (idle ~100s)
    # não derrubar a conexão enquanto o n8n trabalha.
    location = /api/chat/stream {
        proxy_pass http://backend:8080/api/chat/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # Proxy all API calls to the backend container. Timeout de leitura elevado para acomodar
    # o anexo síncrono processado pelo pipeline multi-agente (POST /api/chat/anexo), abaixo do
    # teto de idle (~100s) do Cloudflare free — o pipeline é orçado em <90s (ver Fase A do plano).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 98s;
        proxy_send_timeout 98s;
    }

    # Service worker e manifest do PWA: nunca cachear pelo navegador/proxy — senão a
    # atualização de versão trava (o navegador continua servindo o SW antigo).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets com hash no nome (gerados pelo Vite) — imutáveis, cache longo pelo navegador/CDN.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
