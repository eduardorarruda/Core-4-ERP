# nginx do frontend (imagem nginxinc/nginx-unprivileged — roda como usuário 101).
# Este arquivo é incluído dentro do bloco `http {}` (conf.d/default.conf), por isso os `map`
# podem ficar aqui no topo.
#
# REGRA IMPORTANTE (herança do add_header): um `add_header` dentro de um `location` DESCARTA
# todos os `add_header` do nível `server`. Por isso NENHUM location abaixo usa add_header:
# os cabeçalhos variáveis (Cache-Control, X-Robots-Tag) vêm de `map` e são emitidos uma única
# vez no nível `server`. Valor vazio no map = o cabeçalho não é enviado.

# IP real do cliente (módulo realip): o CF-Connecting-IP SÓ é aceito quando a conexão vem do
# container cloudflared — IP fixo 172.31.10.10 na rede `edge` (ver docker-compose.yml). De qualquer
# outra origem o cabeçalho é ignorado e vale o peer ($remote_addr): sem isso, quem alcançasse o
# nginx sem passar pela Cloudflare forjaria o IP e burlaria o rate limit por IP do backend.
# Depois disto, $remote_addr JÁ é o IP real confiável — é ele que vai para o backend.
set_real_ip_from 172.31.10.10;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Esquema original: o túnel termina o TLS e repassa X-Forwarded-Proto=https.
map $http_x_forwarded_proto $core4_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Cache por status + caminho. Avaliado na hora de montar a resposta — no fallback do SPA o $uri
# já é /index.html, então toda rota do app recebe no-cache (deploy novo aparece na hora).
# Só respostas de SUCESSO de /assets/ ganham "immutable": um 404 em /assets/x.js cacheado como
# imutável (CDN/navegador) quebraria o app até expirar. Erros do nginx recebem no-store; os da
# API ficam com o Cache-Control do próprio backend (valor vazio = cabeçalho não enviado).
map "$status:$uri" $core4_cache_control {
    default                                  "";
    ~^(200|206|304):/assets/                 "public, max-age=31536000, immutable";
    ~^[^:]+:/api/                            "";
    ~^(200|304):/index\.html$                "no-cache";
    ~^(200|304):/sw\.js$                     "no-cache, no-store, must-revalidate";
    ~^(200|304):/manifest\.webmanifest$      "no-cache";
    ~^[45]                                   "no-store";
}

# Indexação: só as páginas públicas podem ser indexadas; o resto (app autenticado, API,
# assets) recebe noindex. Usa $request_uri (caminho ORIGINAL, antes do fallback do SPA).
map $request_uri $core4_robots {
    default                                                          "noindex, nofollow";
    ~^/(login|register|privacidade|termos)?/?(\?.*)?$                "";
    ~^/(robots\.txt|sitemap\.xml|llms\.txt)(\?.*)?$                  "";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Backend aceita até 5 MB por arquivo / 6 MB por request (multipart) — folga para o envelope.
    client_max_body_size 8m;

    # ── Compressão ────────────────────────────────────────────────────────────
    gzip on;
    gzip_static on;          # usa .gz pré-comprimido se existir no dist
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # text/html já é comprimido por padrão. NÃO incluir text/event-stream (SSE do chat).
    gzip_types text/plain text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    # ── Cabeçalhos de segurança (em TODAS as respostas, inclusive erros: `always`) ──
    # CSP: script-src 'self' + hashes dos 2 <script> inline do index.html (tema e PWA).
    #   Se esses scripts mudarem, recalcule os hashes (ver DEPLOY.md › "CSP") — senão o
    #   navegador bloqueia o script e o tema/instalação PWA param de funcionar.
    # connect-src: a API é same-origin (/api via este nginx; o build Docker não define
    #   VITE_API_URL). As duas APIs públicas de cotação são usadas pela tela de login (HeroPane).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Q5aCDRwPUWVdOrWhibRw0bIkPWaHjJ1QSplNiKYHz3k=' 'sha256-lMQ8ewQQ28dsn9erH+E5hbwQPUjNP95iieOh7ZeZcQ8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://economia.awesomeapi.com.br https://api.bcb.gov.br; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $core4_cache_control always;
    add_header X-Robots-Tag $core4_robots always;

    # O backend (Spring Security) também emite alguns destes cabeçalhos — esconde os dele
    # para não duplicar (cabeçalho duplicado/conflitante é ignorado ou mal interpretado).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-XSS-Protection;

    # Chat streaming (SSE) — deve vir ANTES de /api/ (match mais específico).
    # Sem buffering para os deltas chegarem token a token; timeout longo porque o ramo
    # LOTE multi-agente da Áurea (extrator→verificador→revisor→executor→redator) demora.
    # O backend emite comentários de keepalive a cada ~15s para o Cloudflare (idle ~100s)
    # não derrubar a conexão enquanto o n8n trabalha.
    location = /api/chat/stream {
        proxy_pass http://backend:8080/api/chat/stream;
        proxy_set_header Host $host;
        # IP já resolvido pelo realip: os três cabeçalhos são SOBRESCRITOS com o valor confiável
        # (o ClientIpResolver lê CF-Connecting-IP → X-Real-IP; nada do cliente chega cru).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $core4_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        chunked_transfer_encoding off;
        gzip off;
    }

    # Proxy all API calls to the backend container. Timeout de leitura elevado para acomodar
    # o anexo síncrono processado pelo pipeline multi-agente (POST /api/chat/anexo), abaixo do
    # teto de idle (~100s) do Cloudflare free — o pipeline é orçado em <90s (ver Fase A do plano).
    # O Actuator NÃO é alcançável por aqui: ele vive na porta de gestão 8081 do backend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # IP já resolvido pelo realip: os três cabeçalhos são SOBRESCRITOS com o valor confiável
        # (o ClientIpResolver lê CF-Connecting-IP → X-Real-IP; nada do cliente chega cru).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $core4_forwarded_proto;
        proxy_read_timeout 98s;
        proxy_send_timeout 98s;
    }

    # index.html nunca em cache (Cache-Control: no-cache via map) — senão o navegador
    # continua apontando para os assets com hash da versão anterior.
    location = /index.html {
        try_files $uri =404;
    }

    # Service worker e manifest do PWA: nunca cachear pelo navegador/proxy — senão a
    # atualização de versão trava (o navegador continua servindo o SW antigo).
    # (Cache-Control vem do map $core4_cache_control.)
    location = /sw.js {
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        # O mime.types padrão não conhece .webmanifest (sairia application/octet-stream).
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Assets com hash no nome (gerados pelo Vite) — imutáveis, cache longo pelo navegador/CDN.
    # Arquivo inexistente → 404 de verdade (nunca o index.html do SPA) e sem "immutable" (ver map).
    location /assets/ {
        try_files $uri =404;
    }

    # Actuator e arquivos ocultos (.env, .git, …) → 404, nunca o fallback do SPA (que devolvia
    # 200 + index.html e confundia scanners/monitoramento). /.well-known/ continua servido.
    location ~ ^/actuator(/|$) {
        return 404;
    }
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
