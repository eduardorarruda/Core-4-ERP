<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Core 4 ERP</title>
    <script>
      (function() {
        // Sem tema salvo → respeita a preferência do sistema (prefers-color-scheme)
        var saved = localStorage.getItem('theme');
        var t = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      })();
    </script>
    <!-- Captura o evento de instalação do PWA o mais cedo possível: no Chrome/Android ele
         costuma disparar antes do React montar. Guardamos no window e avisamos o app. -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new Event('pwa-installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.deferredInstallPrompt = null;
        window.dispatchEvent(new Event('pwa-installed'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
