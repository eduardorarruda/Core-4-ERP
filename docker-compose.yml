services:
  db:
    image: postgres:16-alpine
    container_name: core4erp-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core4erp}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB:-core4erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./core4erp
    mem_limit: 1500m
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/core4erp}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      SECRET_KEY: ${SECRET_KEY}
      TOKEN_EXPIRATION: ${TOKEN_EXPIRATION:-604800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Ingestão RAG via n8n (pré-processamento do anexo). Aponta para o serviço n8n interno;
      # se o n8n estiver fora, o backend faz fallback e indexa o conteúdo original (best-effort).
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/rag-ingest}
      # Eventos de domínio (cada ação da IA) → workflow 'evento' no n8n (fora do caminho crítico).
      N8N_EVENTOS_WEBHOOK_URL: ${N8N_EVENTOS_WEBHOOK_URL:-http://n8n:5678/webhook/evento}
      # Orquestrador do chat: interno (default) | shadow (só admin) | n8n (todos). Delega ao WF-AUREA.
      CHAT_ORQUESTRADOR: ${CHAT_ORQUESTRADOR:-interno}
      N8N_AUREA_WEBHOOK_URL: ${N8N_AUREA_WEBHOOK_URL:-http://n8n:5678/webhook/aurea}
      # Segredo assinado no header X-Webhook-Secret das chamadas ao n8n (vazio = não envia).
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      # ── Traces → Painel EBPÓS (OpenTelemetry) ────────────────────────────────
      # O -javaagent (no Dockerfile) exporta traces via OTLP/HTTP. Só métricas/logs
      # ficam desligados aqui (o painel já coleta métricas do servidor pelo nmon-agent).
      # Setar NMON_INGEST_KEY no .env ativa o envio; sem ela, deixe OTEL_SDK_DISABLED=true.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-core4erp}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NMON_OTLP_ENDPOINT:-http://2.25.197.81:8095}
      OTEL_EXPORTER_OTLP_HEADERS: X-NMon-Key=${NMON_INGEST_KEY:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build: ./front-end
    container_name: core4erp-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./core4erp/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./core4erp/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:latest
    container_name: loki
    expose:
      - "3100"
    volumes:
      - ./core4erp/monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./core4erp/monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./core4erp/monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3001}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - app-network
    restart: unless-stopped

  # Qdrant — banco vetorial do RAG (embeddings de documentos/descrições). Isolado, na mesma
  # rede (backend e n8n usam internamente http://qdrant:6333). Exposto só em 127.0.0.1 (admin via túnel).
  qdrant:
    # Versão fixada (reprodutibilidade — evita drift de :latest). O cliente Spring AI (gRPC 1.13)
    # emite um WARN de versão contra este servidor, porém as operações usadas (create/upsert/search)
    # são compatíveis. Ao atualizar, casar com a versão do qdrant-client do Spring AI.
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network
    restart: unless-stopped

  # n8n self-hosted — orquestra o processamento pesado/assíncrono da IA (arquivos/lote).
  # Mesma rede do backend (interno: backend -> http://n8n:5678 ; n8n -> http://backend:8080).
  # Exposto só em 127.0.0.1 (acesso ao editor via túnel SSH; n8n é poderoso e não deve ficar
  # público sem TLS). N8N_SECURE_COOKIE=false permite acesso por HTTP no túnel/localhost.
  n8n:
    image: n8nio/n8n:2.28.3
    container_name: n8n
    mem_limit: 1g
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # Público via Cloudflare Tunnel: valores reais ficam no .env do servidor (gitignored).
      # Defaults abaixo = uso local (localhost) — não quebra o `docker compose up` de dev.
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      # Atrás do cloudflared (1 proxy): N8N_PROXY_HOPS=1 faz o n8n confiar no X-Forwarded-Proto
      # do túnel, para o cookie seguro (N8N_SECURE_COOKIE=true) funcionar sem falso "URL inseguro".
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-0}
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_DIAGNOSTICS_ENABLED=false
      # Persistência: SQLite por padrão (dev local — não quebra o `docker compose up`).
      # Em produção o .env seta N8N_DB_TYPE=postgresdb → usa o Postgres do compose
      # (database 'n8n', mesmo servidor/credenciais do backend) para execuções persistentes.
      - DB_TYPE=${N8N_DB_TYPE:-sqlite}
      - DB_POSTGRESDB_HOST=${N8N_DB_HOST:-db}
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${DB_USERNAME}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      # Segredo compartilhado backend↔n8n: os workflows validam o header X-Webhook-Secret
      # contra este valor (via $env). Vazio = webhooks abertos (dev). Setado no .env em produção.
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  n8n_data:
  qdrant_data:

networks:
  app-network:
    driver: bridge
